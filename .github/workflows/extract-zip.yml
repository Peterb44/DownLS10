name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'DownLS10.zip'
      - '.github/workflows/extract-zip.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Extract ZIP
        run: |
          mkdir -p extracted
          7z x DownLS10.zip -oextracted -y
          find extracted -maxdepth 4 -type f | head -200
      - name: Save extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
          if-no-files-found: error
