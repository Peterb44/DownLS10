name: Extract ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'DownLS10.zip'
      - '.github/workflows/extract-zip.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Extract project files into repository
        if: hashFiles('DownLS10.zip') != ''
        run: |
          test -f DownLS10.zip
          7z x DownLS10.zip -y
          echo "Extracted files:"
          find . -maxdepth 3 -type f ! -path './.git/*' | head -200
      - name: Remove only the ZIP and commit extracted files
        if: hashFiles('DownLS10.zip') != ''
        run: |
          rm -- DownLS10.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # GitHub blocks the Actions token from pushing new workflow files.
          # Keep the build workflow in the ZIP for now; commit all other project files.
          git reset -- .github/workflows/build-apk.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Extract project files and remove ZIP archive"
            git push
          else
            echo "No changes to commit."
          fi
